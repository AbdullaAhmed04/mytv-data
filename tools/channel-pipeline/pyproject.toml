[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mytv-channel-pipeline"
version = "1.3.7"
description = "Deterministic HTTPS-only IPTV-org and Free-TV discovery/review pipeline for MYTV"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["mytv_pipeline"]
