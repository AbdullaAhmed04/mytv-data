[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mytv-channel-pipeline"
version = "1.0.1"
description = "Deterministic HTTPS-only IPTV-org discovery and review pipeline for MYTV"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["mytv_pipeline"]
